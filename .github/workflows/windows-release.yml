name: Windows installer
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Dependencies
        run: python -m pip install -r config/requirements.txt -r packaging/build-requirements.txt
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os; from system.version import VERSION; assert os.environ['RELEASE_TAG'] == 'v' + VERSION, 'Tag and application version differ'"
      - name: Offline regression
        run: python -m unittest discover -s tests -q
      - name: Browser installation
        run: python -m playwright install chromium
      - name: UI smoke
        run: python tests/ui_smoke.py
      - name: WebView2 smoke
        run: python tests/desktop_smoke.py
      - name: Install pinned Inno Setup
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile "$env:RUNNER_TEMP\inno.exe"
          $signature = Get-AuthenticodeSignature "$env:RUNNER_TEMP\inno.exe"
          if ($signature.Status -ne 'Valid') { throw 'Invalid Inno Setup signature' }
          $process = Start-Process "$env:RUNNER_TEMP\inno.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Inno Setup installation failed' }
      - name: Build installer and manifest
        run: python packaging/build.py --iscc "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
      - name: Packaged desktop smoke
        run: python tests/packaged_smoke.py --exe dist/WebScraper/WebScraper.exe
      - name: Installer and frozen updater smoke
        run: python tests/installer_smoke.py --installer release/WebScraper-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: WebScraper-windows
          path: release/*
          if-no-files-found: error
  draft:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WebScraper-windows
          path: release
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; preserving its verified assets."
          else
            gh release create "$RELEASE_TAG" release/WebScraper-Setup.exe release/update.json --draft --title "WebScraper $RELEASE_TAG" --notes-file release/release-notes.md
          fi
